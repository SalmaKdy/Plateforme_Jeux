<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Four — GameHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#e0ecf8;user-select:none;overflow:hidden}
h1{font-size:1.8rem;color:#5FC2BA;margin-bottom:8px;text-shadow:0 0 20px rgba(95,194,186,.5)}
#scores{display:flex;gap:16px;margin-bottom:12px}
.sbox{background:rgba(95,194,186,.1);border:1px solid rgba(95,194,186,.2);border-radius:8px;padding:6px 18px;text-align:center;min-width:90px}
.sbox label{display:block;font-size:.62rem;color:#8bacc8;text-transform:uppercase;letter-spacing:1px}
.sbox span{font-size:1.2rem;font-weight:700}
#you span{color:#5FC2BA}#ai span{color:#e05c5c}#draws span{color:#8bacc8}
#board{background:#0a1628;padding:14px;border-radius:14px;border:1px solid rgba(95,194,186,.2);box-shadow:0 0 24px rgba(95,194,186,.07)}
#cols-hover{display:flex;height:22px;margin-bottom:4px;gap:6px}
.col-hint{flex:1;border-radius:6px;cursor:pointer;transition:background .12s;display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.col-hint:hover{background:rgba(95,194,186,.18);color:#5FC2BA}
#grid-rows{display:flex;flex-direction:column;gap:6px}
.grid-row{display:flex;gap:6px}
.cell{width:54px;height:54px;border-radius:50%;background:#060d1a;border:2px solid rgba(95,194,186,.1);transition:all .15s;cursor:pointer}
.cell.p1{background:radial-gradient(circle at 35% 35%,#7de8e0,#5FC2BA);border-color:#5FC2BA;box-shadow:0 0 14px rgba(95,194,186,.45)}
.cell.p2{background:radial-gradient(circle at 35% 35%,#f08080,#e05c5c);border-color:#e05c5c;box-shadow:0 0 14px rgba(224,92,92,.4)}
.cell.win{animation:pulse .5s ease infinite alternate}
@keyframes pulse{from{box-shadow:0 0 12px rgba(255,200,50,.4)}to{box-shadow:0 0 28px rgba(255,200,50,.9);border-color:#f0c060}}
#msg{margin-top:12px;font-size:.95rem;color:#8bacc8;text-align:center;min-height:1.4em}
button{margin-top:8px;padding:7px 20px;background:rgba(95,194,186,.15);border:1px solid rgba(95,194,186,.35);color:#5FC2BA;border-radius:8px;cursor:pointer;font-size:.88rem}
button:hover{background:rgba(95,194,186,.25)}
</style>
</head>
<body>
<h1>🔴 Connect Four</h1>
<div id="scores">
  <div class="sbox" id="you"><label>Vous 🔵</label><span id="sw">0</span></div>
  <div class="sbox" id="draws"><label>Nuls</label><span id="sd">0</span></div>
  <div class="sbox" id="ai"><label>IA 🔴</label><span id="sa">0</span></div>
</div>
<div id="board">
  <div id="cols-hover"></div>
  <div id="grid-rows"></div>
</div>
<div id="msg">Cliquez sur une colonne pour jouer</div>
<button onclick="reset()">Nouvelle partie</button>
<script>
const ROWS=6,COLS=7;
let board,turn,over,wins=[0,0,0];

function check(b,p){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(c+3<COLS&&[0,1,2,3].every(i=>b[r][c+i]===p))return[[r,c],[r,c+1],[r,c+2],[r,c+3]];
    if(r+3<ROWS&&[0,1,2,3].every(i=>b[r+i][c]===p))return[[r,c],[r+1,c],[r+2,c],[r+3,c]];
    if(r+3<ROWS&&c+3<COLS&&[0,1,2,3].every(i=>b[r+i][c+i]===p))return[[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]];
    if(r+3<ROWS&&c-3>=0&&[0,1,2,3].every(i=>b[r+i][c-i]===p))return[[r,c],[r+1,c-1],[r+2,c-2],[r+3,c-3]];
  }return null;
}

function drop(b,col,p){
  for(let r=ROWS-1;r>=0;r--){if(!b[r][col]){b[r][col]=p;return r;}}return -1;
}

function aiScore(b){
  let s=0;
  // prefer center
  for(let r=0;r<ROWS;r++)if(b[r][3]==='ai')s+=3;
  // score windows
  const win=[[0,1,2,3]];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS-3;c++){
    const w=[b[r][c],b[r][c+1],b[r][c+2],b[r][c+3]];
    const ai=w.filter(v=>v==='ai').length,em=w.filter(v=>!v).length,pl=w.filter(v=>v==='pl').length;
    if(ai===4)s+=1000;else if(ai===3&&em===1)s+=10;else if(ai===2&&em===2)s+=2;
    if(pl===4)s-=1000;else if(pl===3&&em===1)s-=20;
  }
  return s;
}

function bestCol(){
  let best=-Infinity,col=Math.floor(COLS/2);
  [3,2,4,1,5,0,6].forEach(c=>{
    const b=board.map(r=>[...r]);
    if(drop(b,c,'ai')<0)return;
    if(check(b,'ai'))return col=c,best=Infinity;
    // block player
    const b2=board.map(r=>[...r]);
    if(drop(b2,c,'pl')>=0&&check(b2,'pl'))return;
    const sc=aiScore(b);
    if(sc>best){best=sc;col=c;}
  });
  return col;
}

function reset(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  turn='pl';over=false;render();
  document.getElementById('msg').textContent='À vous de jouer — Vous êtes 🔵';
}

function play(col){
  if(over||turn!=='pl')return;
  const r=drop(board,col,'pl');
  if(r<0)return;
  const wl=check(board,'pl');
  if(wl){over=true;wins[0]++;document.getElementById('sw').textContent=wins[0];render(wl);document.getElementById('msg').innerHTML='<strong style="color:#5FC2BA">🎉 Vous avez gagné !</strong>';return;}
  if(board.every(row=>row.every(v=>v))){over=true;wins[2]++;document.getElementById('sd').textContent=wins[2];render();document.getElementById('msg').textContent='Match nul !';return;}
  turn='ai';render();
  document.getElementById('msg').textContent="L'IA réfléchit...";
  setTimeout(()=>{
    const ac=bestCol();drop(board,ac,'ai');
    const wl2=check(board,'ai');
    if(wl2){over=true;wins[1]++;document.getElementById('sa').textContent=wins[1];render(wl2);document.getElementById('msg').innerHTML='<strong style="color:#e05c5c">L\'IA a gagné !</strong> Réessayez.';return;}
    if(board.every(row=>row.every(v=>v))){over=true;wins[2]++;document.getElementById('sd').textContent=wins[2];render();document.getElementById('msg').textContent='Match nul !';return;}
    turn='pl';document.getElementById('msg').textContent='À votre tour !';render();
  },400);
}

function render(winLine){
  // col hints
  const ch=document.getElementById('cols-hover');ch.innerHTML='';
  for(let c=0;c<COLS;c++){
    const d=document.createElement('div');d.className='col-hint';d.textContent='▼';
    d.addEventListener('click',()=>play(c));
    ch.appendChild(d);
  }
  // grid
  const gr=document.getElementById('grid-rows');gr.innerHTML='';
  for(let r=0;r<ROWS;r++){
    const row=document.createElement('div');row.className='grid-row';
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');cell.className='cell';
      if(board[r][c]==='pl')cell.classList.add('p1');
      else if(board[r][c]==='ai')cell.classList.add('p2');
      if(winLine&&winLine.some(([wr,wc])=>wr===r&&wc===c))cell.classList.add('win');
      cell.addEventListener('click',()=>play(c));
      row.appendChild(cell);
    }
    gr.appendChild(row);
  }
}
reset();
</script>
</body>
</html>
