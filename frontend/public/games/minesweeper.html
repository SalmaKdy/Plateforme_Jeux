<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minesweeper — GameHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#e0ecf8;user-select:none;overflow:hidden}
h1{font-size:1.8rem;color:#5FC2BA;margin-bottom:4px;text-shadow:0 0 20px rgba(95,194,186,.5)}
#hud{display:flex;gap:20px;margin-bottom:12px;font-size:.9rem;align-items:center}
.hitem{background:rgba(95,194,186,.1);border:1px solid rgba(95,194,186,.2);border-radius:8px;padding:5px 14px;text-align:center}
.hitem label{display:block;font-size:.62rem;color:#8bacc8;text-transform:uppercase;letter-spacing:1px}
.hitem span{font-size:1.1rem;font-weight:700;color:#5FC2BA}
select{background:#0a1628;border:1px solid rgba(95,194,186,.3);color:#5FC2BA;padding:6px 10px;border-radius:8px;font-size:.85rem;cursor:pointer}
#grid{display:grid;gap:3px;background:#0a1628;padding:10px;border-radius:12px;border:1px solid rgba(95,194,186,.2)}
.cell{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .1s;background:rgba(15,30,60,.9);border:1px solid rgba(95,194,186,.15)}
.cell:hover{background:rgba(95,194,186,.12);border-color:rgba(95,194,186,.35)}
.cell.open{background:#080f20;border-color:rgba(95,194,186,.08);cursor:default}
.cell.flag{background:rgba(240,100,100,.1);border-color:rgba(240,100,100,.3)}
.cell.mine{background:rgba(224,92,92,.2);border-color:#e05c5c}
.n1{color:#5FC2BA}.n2{color:#4aada6}.n3{color:#e05c5c}.n4{color:#f0c060}.n5{color:#c04080}.n6{color:#40c080}.n7{color:#e0ecf8}.n8{color:#8bacc8}
#msg{margin-top:12px;font-size:.9rem;color:#8bacc8;min-height:1.4em;text-align:center}
button{padding:7px 18px;background:rgba(95,194,186,.15);border:1px solid rgba(95,194,186,.35);color:#5FC2BA;border-radius:8px;cursor:pointer;font-size:.85rem}
button:hover{background:rgba(95,194,186,.25)}
#flaghint{font-size:.75rem;color:rgba(138,172,200,.5);margin-top:6px}
</style>
</head>
<body>
<h1>💣 Minesweeper</h1>
<div id="hud">
  <div class="hitem"><label>Mines</label><span id="mcount">10</span></div>
  <div class="hitem"><label>Temps</label><span id="timer">0s</span></div>
  <select id="diff" onchange="applyDiff()">
    <option value="9,9,10">Facile (9×9)</option>
    <option value="16,16,40" selected>Moyen (16×16)</option>
    <option value="16,30,99">Difficile (16×30)</option>
  </select>
  <button onclick="newGame()">Nouveau</button>
</div>
<div id="grid"></div>
<div id="msg">Cliquez pour révéler · Clic droit / long-press pour signaler</div>
<div id="flaghint">Mobile : appui long pour poser un drapeau</div>
<script>
let ROWS=16,COLS=16,MINES=40;
let board,revealed,flagged,started,over,timerInt,remaining,longPressTimer;

function applyDiff(){
  const [r,c,m]=document.getElementById('diff').value.split(',').map(Number);
  ROWS=r;COLS=c;MINES=m;newGame();
}

function newGame(){
  clearInterval(timerInt);started=false;over=false;
  board=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  revealed=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  flagged=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  remaining=MINES;
  document.getElementById('mcount').textContent=MINES;
  document.getElementById('timer').textContent='0s';
  document.getElementById('msg').textContent='Cliquez pour révéler · Clic droit / long-press pour signaler';
  render();
}

function placeMines(sr,sc){
  let placed=0;
  while(placed<MINES){
    const r=Math.floor(Math.random()*ROWS),c=Math.floor(Math.random()*COLS);
    if(board[r][c]===-1)continue;
    if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;
    board[r][c]=-1;placed++;
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(board[r][c]===-1)continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1)n++;
    }
    board[r][c]=n;
  }
}

function reveal(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS||revealed[r][c]||flagged[r][c])return;
  revealed[r][c]=true;
  if(board[r][c]===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)reveal(r+dr,c+dc);
}

function click(r,c){
  if(over||revealed[r][c]||flagged[r][c])return;
  if(!started){
    started=true;placeMines(r,c);
    let t=0;timerInt=setInterval(()=>{t++;document.getElementById('timer').textContent=t+'s';},1000);
  }
  if(board[r][c]===-1){
    revealed[r][c]=true;over=true;clearInterval(timerInt);
    // reveal all mines
    for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(board[rr][cc]===-1)revealed[rr][cc]=true;
    document.getElementById('msg').innerHTML='<strong style="color:#e05c5c">💥 Boom !</strong> Vous avez touché une mine.';
    render();return;
  }
  reveal(r,c);
  const won=board.every((row,ri)=>row.every((v,ci)=>v===-1||revealed[ri][ci]));
  if(won){over=true;clearInterval(timerInt);document.getElementById('msg').innerHTML='<strong style="color:#5FC2BA">🎉 Vous avez gagné !</strong> Toutes les mines désamorcées !';}
  render();
}

function flag(r,c){
  if(over||revealed[r][c])return;
  flagged[r][c]=!flagged[r][c];
  remaining+=flagged[r][c]?-1:1;
  document.getElementById('mcount').textContent=remaining;
  render();
}

function render(){
  const g=document.getElementById('grid');
  g.style.gridTemplateColumns='repeat('+COLS+',34px)';
  g.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const el=document.createElement('div');el.className='cell';
    const isRev=revealed[r][c],isFlag=flagged[r][c];
    if(isFlag&&!isRev){el.classList.add('flag');el.textContent='🚩';}
    else if(isRev){
      el.classList.add('open');
      if(board[r][c]===-1){el.classList.add('mine');el.textContent='💣';}
      else if(board[r][c]>0){el.classList.add('n'+board[r][c]);el.textContent=board[r][c];}
    }
    if(!isRev&&!over){
      el.addEventListener('click',()=>click(r,c));
      el.addEventListener('contextmenu',e=>{e.preventDefault();flag(r,c);});
      // long press for mobile
      el.addEventListener('touchstart',()=>{longPressTimer=setTimeout(()=>flag(r,c),500);},{passive:true});
      el.addEventListener('touchend',()=>clearTimeout(longPressTimer),{passive:true});
    }
    g.appendChild(el);
  }
}
newGame();
</script>
</body>
</html>
