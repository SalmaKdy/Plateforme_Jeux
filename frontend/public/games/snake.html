<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake — GameHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#e0ecf8;user-select:none;overflow:hidden}
h1{font-size:1.8rem;color:#5FC2BA;margin-bottom:6px;text-shadow:0 0 20px rgba(95,194,186,.5)}
#score{font-size:1.3rem;font-weight:700;color:#5FC2BA;margin-bottom:10px}
canvas{background:#080f20;border:2px solid rgba(95,194,186,.35);border-radius:10px;box-shadow:0 0 30px rgba(95,194,186,.12)}
#msg{margin-top:12px;font-size:.88rem;color:#8bacc8;text-align:center;line-height:1.6}
#btns{display:none;margin-top:14px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.dpad{width:52px;height:52px;border-radius:10px;background:rgba(95,194,186,.15);border:1px solid rgba(95,194,186,.3);color:#5FC2BA;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dpad:active{background:rgba(95,194,186,.35)}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div id="score">Score : 0</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="msg">Appuyez sur <strong>Espace</strong> pour démarrer<br>← → ↑ ↓ pour diriger le serpent</div>
<div id="btns">
  <div></div><div class="dpad" id="bu">▲</div><div></div>
  <div class="dpad" id="bl">◀</div><div class="dpad" id="bd">▼</div><div class="dpad" id="br">▶</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const G=20,COLS=20,ROWS=20;
let snake,dir,nextDir,food,score,tid,running=false;

function init(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir=null;score=0;running=false;
  placeFood();
  document.getElementById('score').textContent='Score : 0';
  document.getElementById('msg').innerHTML='Appuyez sur <strong>Espace</strong> pour démarrer<br>← → ↑ ↓ pour diriger le serpent';
  clearInterval(tid);draw();
}

function start(){
  if(running)return;
  running=true;
  document.getElementById('msg').textContent='';
  tid=setInterval(tick,110);
}

function placeFood(){
  let f;
  do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
  while(snake.some(s=>s.x===f.x&&s.y===f.y));
  food=f;
}

function tick(){
  if(nextDir)dir=nextDir,nextDir=null;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS||snake.some(s=>s.x===h.x&&s.y===h.y)){
    clearInterval(tid);running=false;
    document.getElementById('msg').innerHTML='<strong style="color:#e05c5c">Game Over</strong> — Score : '+score+'<br>Espace pour rejouer';
    return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){
    score+=10;
    document.getElementById('score').textContent='Score : '+score;
    placeFood();
  } else snake.pop();
  draw();
}

function draw(){
  ctx.fillStyle='#080f20';ctx.fillRect(0,0,400,400);
  // grid dots
  ctx.fillStyle='rgba(95,194,186,.04)';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ctx.beginPath();ctx.arc(x*G+G/2,y*G+G/2,1,0,Math.PI*2);ctx.fill();}
  // food
  ctx.shadowColor='#ff6b6b';ctx.shadowBlur=14;
  ctx.fillStyle='#ff6b6b';
  ctx.beginPath();ctx.arc(food.x*G+G/2,food.y*G+G/2,G/2-2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  // snake
  snake.forEach((s,i)=>{
    const alpha=Math.max(0.3,1-i*0.025);
    ctx.fillStyle=i===0?'#5FC2BA':`rgba(95,194,186,${alpha})`;
    ctx.shadowColor='#5FC2BA';ctx.shadowBlur=i<3?8:0;
    ctx.beginPath();ctx.roundRect(s.x*G+1,s.y*G+1,G-2,G-2,4);ctx.fill();
  });
  ctx.shadowBlur=0;
}

document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  if(m[e.key]){
    e.preventDefault();
    const nd=m[e.key];
    if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;
    start();
  }
  if(e.key===' '){e.preventDefault();if(!running)init();}
});

// Touch/swipe
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;start();},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<10)return;
  let nd;
  if(Math.abs(dx)>Math.abs(dy)) nd=dx>0?{x:1,y:0}:{x:-1,y:0};
  else nd=dy>0?{x:0,y:1}:{x:0,y:-1};
  if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;
},{passive:true});

// D-pad buttons
if('ontouchstart' in window) document.getElementById('btns').style.display='grid';
const dmap={bu:{x:0,y:-1},bd:{x:0,y:1},bl:{x:-1,y:0},br:{x:1,y:0}};
Object.entries(dmap).forEach(([id,nd])=>{
  document.getElementById(id).addEventListener('click',()=>{
    if(nd.x!==-dir.x||nd.y!==-dir.y)nextDir=nd;
    start();
  });
});

init();
</script>
</body>
</html>
