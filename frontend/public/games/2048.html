<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048 — GameHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#e0ecf8;user-select:none;overflow:hidden}
h1{font-size:1.8rem;color:#5FC2BA;margin-bottom:4px;text-shadow:0 0 20px rgba(95,194,186,.5)}
#scores{display:flex;gap:20px;margin-bottom:12px}
.sbox{background:rgba(95,194,186,.1);border:1px solid rgba(95,194,186,.2);border-radius:8px;padding:6px 16px;text-align:center}
.sbox label{font-size:.7rem;color:#8bacc8;display:block;text-transform:uppercase;letter-spacing:1px}
.sbox span{font-size:1.2rem;font-weight:700;color:#5FC2BA}
#board{display:grid;grid-template-columns:repeat(4,90px);grid-template-rows:repeat(4,90px);gap:8px;background:#0a1628;padding:12px;border-radius:12px;border:1px solid rgba(95,194,186,.2);box-shadow:0 0 30px rgba(95,194,186,.08)}
.tile{width:90px;height:90px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;transition:background .08s}
#msg{margin-top:12px;font-size:.88rem;color:#8bacc8;text-align:center}
button{margin-top:10px;padding:8px 20px;background:rgba(95,194,186,.15);border:1px solid rgba(95,194,186,.35);color:#5FC2BA;border-radius:8px;cursor:pointer;font-size:.9rem}
button:hover{background:rgba(95,194,186,.25)}
</style>
</head>
<body>
<h1>🔢 2048</h1>
<div id="scores">
  <div class="sbox"><label>Score</label><span id="sc">0</span></div>
  <div class="sbox"><label>Meilleur</label><span id="best">0</span></div>
</div>
<div id="board"></div>
<div id="msg">← → ↑ ↓ ou glisser pour jouer</div>
<button onclick="init()">Nouvelle partie</button>
<script>
const C={
  0:'#101e38',2:'#1a3a5c',4:'#1e4a70',8:'#5FC2BA',16:'#4aada6',32:'#3a9890',64:'#2a8480',
  128:'#f0c060',256:'#f0a830',512:'#f09020',1024:'#e07818',2048:'#d06010',4096:'#c04000'
};
const TC={0:'#8bacc8',2:'#e0ecf8',4:'#e0ecf8',8:'#060d1a',16:'#060d1a',32:'#e0ecf8',64:'#e0ecf8'};
let grid,score,best=0,over=false;

function init(){
  grid=Array.from({length:4},()=>Array(4).fill(0));
  score=0;over=false;
  add();add();
  render();
  document.getElementById('msg').textContent='← → ↑ ↓ ou glisser pour jouer';
}

function add(){
  const e=[];
  for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!grid[r][c])e.push([r,c]);
  if(!e.length)return;
  const[r,c]=e[Math.floor(Math.random()*e.length)];
  grid[r][c]=Math.random()<.9?2:4;
}

function slideRow(row){
  let a=row.filter(x=>x),merged=false;
  for(let i=0;i<a.length-1;i++){
    if(!merged&&a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);merged=true;}
    else merged=false;
  }
  while(a.length<4)a.push(0);
  return a;
}

function move(d){
  if(over)return;
  const old=JSON.stringify(grid);
  if(d==='left') for(let r=0;r<4;r++) grid[r]=slideRow(grid[r]);
  else if(d==='right') for(let r=0;r<4;r++) grid[r]=slideRow([...grid[r]].reverse()).reverse();
  else if(d==='up') for(let c=0;c<4;c++){const col=grid.map(r=>r[c]);const n=slideRow(col);n.forEach((v,r)=>grid[r][c]=v);}
  else for(let c=0;c<4;c++){const col=grid.map(r=>r[c]);const n=slideRow([...col].reverse()).reverse();n.forEach((v,r)=>grid[r][c]=v);}

  if(JSON.stringify(grid)!==old){add();render();}
  if(best<score){best=score;document.getElementById('best').textContent=best;}

  if(grid.some(r=>r.includes(2048))){
    document.getElementById('msg').innerHTML='<strong style="color:#f0c060">🎉 2048 atteint !</strong> Continuez ou relancez.';
  } else if(!canMove()){
    over=true;
    document.getElementById('msg').innerHTML='<strong style="color:#e05c5c">Game Over</strong> — Score : '+score;
  }
}

function canMove(){
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    if(!grid[r][c])return true;
    if(c<3&&grid[r][c]===grid[r][c+1])return true;
    if(r<3&&grid[r][c]===grid[r+1][c])return true;
  }
  return false;
}

function render(){
  document.getElementById('sc').textContent=score;
  const b=document.getElementById('board');b.innerHTML='';
  grid.forEach(row=>row.forEach(v=>{
    const d=document.createElement('div');d.className='tile';
    d.style.background=C[v]||'#b05010';
    d.style.color=TC[v]||'#fff';
    d.style.fontSize=v>999?'1.1rem':v>99?'1.35rem':'1.6rem';
    if(v)d.textContent=v;
    b.appendChild(d);
  }));
}

document.addEventListener('keydown',e=>{
  const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(m[e.key]){e.preventDefault();move(m[e.key]);}
});
let sx,sy;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
  else move(dy>0?'down':'up');
},{passive:true});

init();
</script>
</body>
</html>
