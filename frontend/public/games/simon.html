<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simon Says — GameHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#e0ecf8;user-select:none;overflow:hidden}
h1{font-size:1.8rem;color:#5FC2BA;margin-bottom:4px;text-shadow:0 0 20px rgba(95,194,186,.5)}
#hud{display:flex;gap:20px;margin-bottom:18px}
.hbox{background:rgba(95,194,186,.1);border:1px solid rgba(95,194,186,.2);border-radius:8px;padding:6px 16px;text-align:center}
.hbox label{display:block;font-size:.62rem;color:#8bacc8;text-transform:uppercase;letter-spacing:1px}
.hbox span{font-size:1.2rem;font-weight:700;color:#5FC2BA}
#simonBoard{position:relative;width:280px;height:280px}
.quadrant{position:absolute;width:128px;height:128px;border-radius:50%;cursor:pointer;transition:filter .08s,transform .08s;filter:brightness(.5)}
.quadrant:hover{filter:brightness(.7)}
.quadrant.lit{filter:brightness(1.2)!important;transform:scale(1.04)}
#q0{top:0;left:0;background:radial-gradient(circle at 35% 35%,#4ade80,#16a34a);border-radius:100% 10% 50% 10%}
#q1{top:0;right:0;background:radial-gradient(circle at 65% 35%,#f87171,#dc2626);border-radius:10% 100% 10% 50%}
#q2{bottom:0;left:0;background:radial-gradient(circle at 35% 65%,#60a5fa,#2563eb);border-radius:10% 50% 100% 10%}
#q3{bottom:0;right:0;background:radial-gradient(circle at 65% 65%,#fbbf24,#d97706);border-radius:50% 10% 10% 100%}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:#060d1a;border:3px solid rgba(95,194,186,.3);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#5FC2BA;text-align:center;line-height:1.2;cursor:pointer;z-index:10}
#center:hover{border-color:#5FC2BA}
#msg{margin-top:16px;font-size:.95rem;color:#8bacc8;text-align:center;min-height:1.4em}
</style>
</head>
<body>
<h1>🟢 Simon Says</h1>
<div id="hud">
  <div class="hbox"><label>Manche</label><span id="round">0</span></div>
  <div class="hbox"><label>Meilleur</label><span id="best">0</span></div>
</div>
<div id="simonBoard">
  <div class="quadrant" id="q0"></div>
  <div class="quadrant" id="q1"></div>
  <div class="quadrant" id="q2"></div>
  <div class="quadrant" id="q3"></div>
  <div id="center">START</div>
</div>
<div id="msg">Appuyez sur START pour jouer</div>
<script>
const COLORS=[
  {id:'q0',freq:329.6,label:'Vert'},
  {id:'q1',freq:440,label:'Rouge'},
  {id:'q2',freq:261.6,label:'Bleu'},
  {id:'q3',freq:392,label:'Jaune'},
];
let seq=[],player=[],round=0,best=0,accepting=false,playing=false;
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let actx;

function beep(freq,dur=0.25){
  if(!actx)try{actx=new AudioCtx();}catch(e){return;}
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,actx.currentTime);
  g.gain.linearRampToValueAtTime(0.3,actx.currentTime+0.02);
  g.gain.linearRampToValueAtTime(0,actx.currentTime+dur);
  o.start();o.stop(actx.currentTime+dur+0.05);
}

function light(i,on){document.getElementById(COLORS[i].id).classList.toggle('lit',on);}

function flash(i,dur=350){return new Promise(res=>{light(i,true);beep(COLORS[i].freq,dur/1000);setTimeout(()=>{light(i,false);setTimeout(res,80);},dur);});}

async function playSeq(){
  playing=true;accepting=false;
  const speed=Math.max(150,400-round*15);
  for(const i of seq){await flash(i,speed);await new Promise(r=>setTimeout(r,speed*0.3));}
  playing=false;accepting=true;player=[];
  document.getElementById('msg').textContent='À votre tour ! ('+seq.length+' éléments)';
}

async function startGame(){
  if(!actx)try{actx=new AudioCtx();}catch(e){}
  seq=[];round=0;
  document.getElementById('center').textContent='⏸';
  await nextRound();
}

async function nextRound(){
  round++;seq.push(Math.floor(Math.random()*4));
  document.getElementById('round').textContent=round;
  document.getElementById('msg').textContent='Regardez la séquence...';
  await new Promise(r=>setTimeout(r,600));
  await playSeq();
}

async function handleClick(i){
  if(!accepting)return;
  await flash(i,220);
  player.push(i);
  const idx=player.length-1;
  if(player[idx]!==seq[idx]){
    // wrong
    accepting=false;
    beep(160,0.6);
    document.getElementById('msg').innerHTML='<strong style="color:#e05c5c">❌ Erreur !</strong> La séquence était : '+seq.map(x=>COLORS[x].label).join(' → ');
    if(round>best){best=round-1;document.getElementById('best').textContent=best;}
    await new Promise(r=>setTimeout(r,1000));
    document.getElementById('center').textContent='START';document.getElementById('round').textContent=0;
    document.getElementById('msg').textContent='Appuyez sur START pour rejouer';
    return;
  }
  if(player.length===seq.length){
    accepting=false;
    document.getElementById('msg').textContent='✅ Correct !';
    await new Promise(r=>setTimeout(r,700));
    await nextRound();
  }
}

document.getElementById('center').addEventListener('click',()=>{if(!playing&&!accepting)startGame();});
COLORS.forEach((_,i)=>document.getElementById(COLORS[i].id).addEventListener('click',()=>handleClick(i)));
</script>
</body>
</html>
